---
name: CI-Windows-MF
permissions: {}

on:
  push:
    branches:
      - mf-mft
  workflow_dispatch:

# The vendor whitelist is already relaxed in src/platform/windows/display_vram.cpp
# on this branch, so just call upstream's Windows job and let it package that
# tree.  permissions must be granted on this job as well: the caller's grant caps
# what a reusable workflow may ask for, and omitting it means startup_failure.
jobs:
  windows:
    name: Windows
    permissions:
      contents: read
    uses: ./.github/workflows/ci-windows.yml
    with:
      publish_release: 'false'
      release_commit: ${{ github.sha }}
      release_version: 2026.927.133000
