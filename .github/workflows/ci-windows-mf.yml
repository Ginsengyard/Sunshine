---
name: CI-Windows-MF
permissions: {}

on:
  push:
    branches:
      - mf-mft
  workflow_dispatch:

# Nothing to build differently here: the vendor whitelist is already relaxed in
# src/platform/windows/display_vram.cpp on this branch, so just call upstream's
# Windows job and let it package the patched tree.
jobs:
  windows:
    name: Windows
    uses: ./.github/workflows/ci-windows.yml
    with:
      publish_release: 'false'
      release_commit: ${{ github.sha }}
      release_version: 2026.927.133000
